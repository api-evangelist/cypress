name: Cypress
description: >-
  Cypress Semiconductor Corporation was a San Jose, California semiconductor
  company founded in 1982, and an early Mayfield venture investment. It designed
  and manufactured mixed-signal, embedded, and connectivity silicon — most
  notably the PSoC programmable system-on-chip microcontrollers, WICED Wi-Fi and
  Bluetooth wireless combos, USB controllers (EZ-USB), NOR flash and SRAM
  memory, and automotive Traveo microcontrollers — supported by the ModusToolbox
  and PSoC Creator developer tooling and the Cypress Developer Community.
  Infineon Technologies AG acquired Cypress in April 2020 for approximately
  9.4 billion dollars; the business, its developer community, and its GitHub
  repositories have since been folded into Infineon. cypress.com now redirects
  to infineon.com and the developer resources live at community.infineon.com.
  Cypress shipped hardware SDKs and embedded toolchains rather than a public
  web/REST API, so there is no independent HTTP API surface to catalog for this
  entity — this profile documents it as a historical, acquired provider.
